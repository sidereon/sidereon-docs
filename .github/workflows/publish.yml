# Build the documentation site and publish it to GitHub Pages.
#
# The API reference, example pages and changelog are read from the private sidereon-adk
# repository at build time, so the site always matches the SDK's main branch.
# One-time set-up: secret ADK_READ_KEY (read-only deploy key of sidereon-adk) and
# Settings → Pages → Source: GitHub Actions. See README.md.
name: Publish docs

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 2 * * *" # nightly, to pick up SDK changes
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SIDEREON_ADK_PATH: ${{ github.workspace }}/sidereon-adk
      DOCS_BASE_URL: ${{ vars.DOCS_BASE_URL || 'https://sidereon.github.io/sidereon-docs/' }}
    steps:
      - uses: actions/checkout@v7

      - name: Check out the SDK (private, read-only)
        uses: actions/checkout@v7
        with:
          repository: sidereon/sidereon-adk
          ssh-key: ${{ secrets.ADK_READ_KEY }}
          persist-credentials: false
          path: sidereon-adk

      - uses: astral-sh/setup-uv@v10

      - name: Install the SDK and the documentation tools
        run: uv venv --python 3.12 .venv && uv pip install -e sidereon-adk -r requirements.txt

      - name: Build (strict)
        run: make docs-build

      - name: Make sure no SDK source code is published
        run: |
          if [ -d _build/html/_modules ]; then
            echo "::error::Source code pages were built; DOCS_SHOW_SOURCE must stay off." && exit 1
          fi
          if grep -rqI "github.com/sidereon/sidereon-adk" _build/html; then
            echo "::error::The site links to the private SDK repository." && exit 1
          fi

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _build/html

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
